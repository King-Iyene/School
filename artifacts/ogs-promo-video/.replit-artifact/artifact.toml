kind = "video"
previewPath = "/ogs-promo-video/"
title = "OGS School Management Promo Video"
version = "1.0.0"
id = "artifacts/ogs-promo-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/ogs-promo-video/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/ogs-promo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ogs-promo-video", "run", "build" ]
publicDir = "artifacts/ogs-promo-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/ogs-promo-video/"
